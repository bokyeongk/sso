spring:
  profiles:
    active: dev
  application:
    name: sso-backend
  datasource:
    url: jdbc:postgresql://192.168.10.30:6543/hubilon_pd
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: msa-service

allowed:
  origin: ${ALLOWED_ORIGIN:http://localhost:5173}

server:
  port: 8080
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

keycloak:
  server-url: http://192.168.10.30:8080
  realm: hubilon_pd
  client-id: sso-index-web
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  oauth-state-cookie: sso-oauth-state
  session-id-token-key: sso-id-token
  secure-cookie: true                       # 로컬 HTTP 개발 시 false
  redirect-uri: http://localhost:8080/auth/callback          # 콜백 URL (각 서비스마다 다르게)
  post-login-redirect-uri: http://localhost:5173               # 로그인 후 이동 경로
  post-logout-redirect-uri: http://localhost:5173/login  # 로그아웃 후 이동할 URL
  auth-controller:
    enabled: true
  uri:
    check-username: /api/v1/auth/check-username
    check-email: /api/v1/auth/check-email
  permit-all-paths:
    - /public/**
    - /health
    - /actuator/**
    - /api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/check-username
    - /api/v1/auth/check-email
    - /api/v1/auth/public-key

